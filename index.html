<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <!-- Local stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="container">
    <h1>Expense &amp; Budget Visualizer</h1>

    <!-- Balance Display -->
    <section class="balance-section" aria-label="Total Balance">
      <h2>Total Balance</h2>
      <div id="balance">$0.00</div>
    </section>

    <!-- Storage Error Toast -->
    <div id="storage-error" role="alert" hidden></div>

    <!-- Cap Message -->
    <p id="cap-message" role="status" hidden></p>

    <!-- Input Form -->
    <section class="form-section" aria-label="Add Transaction">
      <h2>Add Transaction</h2>
      <form id="input-form" novalidate>
        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input
            id="item-name"
            type="text"
            maxlength="100"
            placeholder="e.g. Lunch"
            autocomplete="off"
            required
          />
        </div>

        <div class="form-group">
          <label for="amount">Amount ($)</label>
          <input
            id="amount"
            type="number"
            step="0.01"
            min="0.01"
            max="999999999.99"
            placeholder="0.00"
            required
          />
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>

        <!-- Inline validation error container -->
        <div id="form-error" role="alert" hidden></div>

        <button type="submit" id="add-btn">Add Transaction</button>
      </form>
    </section>

    <!-- Transaction List -->
    <section class="list-section" aria-label="Transaction History">
      <h2>Transaction History</h2>
      <ul id="transaction-list" aria-live="polite"></ul>
      <p id="empty-message" hidden>No transactions yet.</p>
    </section>

    <!-- Pie Chart -->
    <section class="chart-section" aria-label="Spending by Category">
      <h2>Spending by Category</h2>
      <canvas id="chart-canvas" aria-label="Pie chart of spending by category" role="img"></canvas>
      <p id="chart-placeholder" hidden>No data available.</p>
    </section>

  </main>

  <!-- Application logic -->
  <script src="js/app.js" defer></script>
</body>
</html>
